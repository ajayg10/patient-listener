# SYNTHETIC PERSONAS SPECIFICATION
# Purpose: Model conflicting pause distributions across distinct patient speaking archetypes.
# Key property: A 700ms pause indicates 'turn_end' for fast_pauser, but 'mid_thought' for slow_pauser.

archetypes:
  fast_pauser:
    name: "Fast Pauser (Brisk / Urgent)"
    description: "Speaks rapidly with concise utterances and quick turn yields."
    mid_thought_pause:
      mean_ms: 350
      std_ms: 60
      min_ms: 200
      max_ms: 500
    turn_end_pause:
      mean_ms: 700
      std_ms: 100
      min_ms: 550
      max_ms: 1000
    filler_prob: 0.10
    continuation_prob: 0.30
    users:
      # 5 Dev Users
      - id: "user_fast_dev_01"
        split: "dev"
        jitter_ms: -30
      - id: "user_fast_dev_02"
        split: "dev"
        jitter_ms: -20
      - id: "user_fast_dev_03"
        split: "dev"
        jitter_ms: -10
      - id: "user_fast_dev_04"
        split: "dev"
        jitter_ms: 0
      - id: "user_fast_dev_05"
        split: "dev"
        jitter_ms: +20
      # 10 Test Users
      - id: "user_fast_test_01"
        split: "test"
        jitter_ms: -35
      - id: "user_fast_test_02"
        split: "test"
        jitter_ms: -25
      - id: "user_fast_test_03"
        split: "test"
        jitter_ms: -20
      - id: "user_fast_test_04"
        split: "test"
        jitter_ms: -15
      - id: "user_fast_test_05"
        split: "test"
        jitter_ms: -10
      - id: "user_fast_test_06"
        split: "test"
        jitter_ms: 0
      - id: "user_fast_test_07"
        split: "test"
        jitter_ms: +10
      - id: "user_fast_test_08"
        split: "test"
        jitter_ms: +15
      - id: "user_fast_test_09"
        split: "test"
        jitter_ms: +25
      - id: "user_fast_test_10"
        split: "test"
        jitter_ms: +35

  slow_pauser:
    name: "Slow Pauser (Deliberate / Elderly)"
    description: "Speaks slowly and takes extended reflective pauses between clauses."
    mid_thought_pause:
      mean_ms: 850
      std_ms: 120
      min_ms: 650
      max_ms: 1200
    turn_end_pause:
      mean_ms: 1500
      std_ms: 200
      min_ms: 1200
      max_ms: 2200
    filler_prob: 0.25
    continuation_prob: 0.50
    users:
      # 5 Dev Users
      - id: "user_slow_dev_01"
        split: "dev"
        jitter_ms: -30
      - id: "user_slow_dev_02"
        split: "dev"
        jitter_ms: -15
      - id: "user_slow_dev_03"
        split: "dev"
        jitter_ms: 0
      - id: "user_slow_dev_04"
        split: "dev"
        jitter_ms: +20
      - id: "user_slow_dev_05"
        split: "dev"
        jitter_ms: +40
      # 10 Test Users
      - id: "user_slow_test_01"
        split: "test"
        jitter_ms: -40
      - id: "user_slow_test_02"
        split: "test"
        jitter_ms: -30
      - id: "user_slow_test_03"
        split: "test"
        jitter_ms: -20
      - id: "user_slow_test_04"
        split: "test"
        jitter_ms: -10
      - id: "user_slow_test_05"
        split: "test"
        jitter_ms: 0
      - id: "user_slow_test_06"
        split: "test"
        jitter_ms: +10
      - id: "user_slow_test_07"
        split: "test"
        jitter_ms: +20
      - id: "user_slow_test_08"
        split: "test"
        jitter_ms: +30
      - id: "user_slow_test_09"
        split: "test"
        jitter_ms: +40
      - id: "user_slow_test_10"
        split: "test"
        jitter_ms: +50

  filler_heavy:
    name: "Filler-Heavy Pauser (Hesitant / Anxious)"
    description: "Frequently uses verbal fillers ('um', 'uh', 'like') and trailing connectors."
    mid_thought_pause:
      mean_ms: 750
      std_ms: 150
      min_ms: 500
      max_ms: 1300
    turn_end_pause:
      mean_ms: 1100
      std_ms: 180
      min_ms: 800
      max_ms: 1800
    filler_prob: 0.85
    continuation_prob: 0.65
    users:
      # 5 Dev Users
      - id: "user_filler_dev_01"
        split: "dev"
        jitter_ms: -25
      - id: "user_filler_dev_02"
        split: "dev"
        jitter_ms: -15
      - id: "user_filler_dev_03"
        split: "dev"
        jitter_ms: 0
      - id: "user_filler_dev_04"
        split: "dev"
        jitter_ms: +15
      - id: "user_filler_dev_05"
        split: "dev"
        jitter_ms: +30
      # 10 Test Users
      - id: "user_filler_test_01"
        split: "test"
        jitter_ms: -35
      - id: "user_filler_test_02"
        split: "test"
        jitter_ms: -25
      - id: "user_filler_test_03"
        split: "test"
        jitter_ms: -20
      - id: "user_filler_test_04"
        split: "test"
        jitter_ms: -10
      - id: "user_filler_test_05"
        split: "test"
        jitter_ms: 0
      - id: "user_filler_test_06"
        split: "test"
        jitter_ms: +10
      - id: "user_filler_test_07"
        split: "test"
        jitter_ms: +20
      - id: "user_filler_test_08"
        split: "test"
        jitter_ms: +25
      - id: "user_filler_test_09"
        split: "test"
        jitter_ms: +35
      - id: "user_filler_test_10"
        split: "test"
        jitter_ms: +45
