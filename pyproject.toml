[project]
name = "patient-listener"
version = "0.1.0"
description = "Personalized, regret-aware turn-taking for voice agents using Strands Decider 2B"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.1",
    "websockets>=12.0",
    "numpy>=1.26.0",
    "strands-decider>=0.1.0",
    "strands-agents>=1.0.0",
    "boto3>=1.34.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
    "matplotlib>=3.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["patient_listener_pattern", "backend"]


[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["scratch"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501", "E402"]

[tool.pytest.ini_options]
testpaths = ["backend/tests", "patient_listener_pattern/tests"]
asyncio_mode = "auto"
pythonpath = ["."]
